server:
  port: ${PORT:8080}

spring:
  application:
    name: fiflip-backend
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fiflip}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

fiflip:
  resend:
    api-key: ${RESEND_API_KEY:}
  mail:
    from: ${MAIL_FROM:onboarding@resend.dev}
    notify-to: ${LEAD_NOTIFY_EMAIL:crespi.ian@gmail.com}
  meta:
    pixel-id: ${META_PIXEL_ID:}
    capi-token: ${META_CAPI_ACCESS_TOKEN:}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    password: ${ADMIN_PASSWORD:}
    token-secret: ${ADMIN_TOKEN_SECRET:change-me-in-production}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:fiflip-projects}
    public-url-base: ${R2_PUBLIC_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
